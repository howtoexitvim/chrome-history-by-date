<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History by Date</title>
<style>
  /* Light theme. Values track Chrome's own surface and text colors so the
     popup sits naturally next to the browser UI. */
  :root {
    --bg: #ffffff;
    --fg: #1f1f1f;
    --fg-dim: #5f6368;
    --border: #e0e0e0;
    --hover: #f1f3f4;
    --active: #e8eaed;
    --accent: #0b57d0;
    --day-fg: #444746;
    --menu-shadow: 0 2px 12px rgba(0, 0, 0, .18);
  }

  /* Dark theme follows the OS setting; there is no in-page toggle. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f;
      --fg: #e3e3e3;
      --fg-dim: #9aa0a6;
      --border: #3c4043;
      --hover: #2d2e30;
      --active: #3c4043;
      --accent: #a8c7fa;
      --day-fg: #c4c7c5;
      --menu-shadow: 0 2px 12px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }

  /* Chrome draws the popup frame; the document just needs its background. */
  html {
    background: var(--bg);
  }

  /* A popup sizes to its content, so the dimensions are fixed here. The column
     layout keeps the header in place and gives the list the remaining height
     to scroll within. */
  body {
    width: 336px;
    height: 480px;
    margin: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  /* ---------- Header ---------- */

  .titlebar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 8px 8px 16px;
  }

  h1 {
    flex: 1;
    margin: 0;
    font-size: 15px;
    font-weight: 500;
  }

  /* Round icon buttons in the title bar and menu trigger. */
  .icon-btn {
    flex: none;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--fg-dim);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover); color: var(--fg); }
  .icon-btn[aria-expanded="true"] { background: var(--active); color: var(--fg); }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .icon-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .search-wrap { padding: 0 16px 4px; }

  #q {
    width: 100%;
    padding: 9px 14px;
    font-size: 13px;
    color: var(--fg);
    background: var(--bg);
    /* A visible resting border, matching the search field in Edge's panel. */
    border: 1px solid var(--border);
    border-radius: 999px;
    outline: none;
  }
  #q::placeholder { color: var(--fg-dim); }
  #q:focus { border-color: var(--accent); }

  /* ---------- Tabs ---------- */

  .tabs {
    display: flex;
    gap: 2px;
    padding: 6px 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    padding: 8px 10px 9px;
    border: none;
    /* Round only the top corners so the tab reads as sitting on the rule. */
    border-radius: 8px 8px 0 0;
    background: none;
    color: var(--fg-dim);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    /* Reserve the selected indicator's height so selecting does not shift text. */
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab[aria-selected="true"] {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 500;
  }
  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -3px;
  }

  /* ---------- Overflow menu ---------- */

  /* Anchored to the title bar rather than the viewport, so the rounded clip
     on <html> does not cut it off. */
  .menu {
    position: absolute;
    top: 40px;
    right: 8px;
    z-index: 10;
    min-width: 210px;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    box-shadow: var(--menu-shadow);
  }
  .menu[hidden] { display: none; }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--fg);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .menu-item:hover { background: var(--hover); }
  .menu-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .menu-item svg { flex: none; width: 16px; height: 16px; fill: currentColor; }



  /* ---------- List ---------- */

  /* Side padding insets the rows so their rounded corners are visible. */
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 12px;
  }

  /* Date heading. A visual separator only: rows stay in one flat sort order. */
  .day {
    padding: 14px 10px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--day-fg);
  }

  /* One entry: favicon, title and host, visit count, time. */
  a.item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 7px 10px;
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
  }
  a.item:hover { background: var(--hover); }

  /* Inset the outline so it is not clipped by the scroll container. */
  a.item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .fav {
    flex: none;
    width: 16px;
    height: 16px;
    border-radius: 3px;
  }

  /* min-width:0 lets this flex child shrink below its content width, which is
     what allows the title and host to ellipsize instead of stretching the row. */
  .text {
    min-width: 0;
    flex: 1;
  }

  .title,
  .url {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .url {
    font-size: 11px;
    color: var(--fg-dim);
  }

  /* Tabular figures keep timestamps aligned down the column. */
  .time {
    flex: none;
    font-size: 11px;
    color: var(--fg-dim);
    font-variant-numeric: tabular-nums;
  }

  /* Visit-count pill, shown only for pages visited more than once. */
  .visits {
    flex: none;
    min-width: 18px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--hover);
    font-size: 10px;
    color: var(--fg-dim);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  /* Swap against the row's hover fill so the pill stays distinguishable. */
  a.item:hover .visits { background: var(--bg); }

  /* Covers empty results, errors, and the loading beat before data arrives. */
  .empty {
    padding: 40px 14px;
    text-align: center;
    color: var(--fg-dim);
  }

  /* ---------- Animations ---------- */

  /* Popup entrance: the whole body fades and slides up slightly. */
  @keyframes popup-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  body {
    animation: popup-in .15s ease-out;
  }

  /* List items stagger in with a subtle fade + slide. */
  @keyframes row-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .day, a.item {
    animation: row-in .18s ease-out both;
  }

  /* Smooth hover / focus transitions on interactive elements. */
  .icon-btn       { transition: background .12s, color .12s; }
  .tab            { transition: background .12s, color .12s, border-color .12s; }
  a.item          { transition: background .12s; }
  .menu-item      { transition: background .12s; }
  #q              { transition: border-color .15s, box-shadow .15s; }
  #q:focus        { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }

  /* Menu opens with a subtle scale + fade. */
  .menu {
    animation: menu-in .12s ease-out;
    transform-origin: top right;
  }
  @keyframes menu-in {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="titlebar">
    <h1>History</h1>

    <button id="clear" class="icon-btn" title="Clear browsing data">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
    </button>

    <button id="more" class="icon-btn" title="More options"
            aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"/></svg>
    </button>

    <div id="menu" class="menu" role="menu" hidden>
      <button class="menu-item" role="menuitem" data-action="openHistoryPage">
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h560v-280h80v280q0 33-23.5 56.5T760-120H200Zm188-212-56-56 372-372H560v-80h280v280h-80v-144L388-332Z"/></svg>
        Open History Page
      </button>
    </div>
  </div>

  <div class="search-wrap">
    <input id="q" type="search" placeholder="Search history" autofocus>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="all" aria-selected="true">All</button>
    <button class="tab" role="tab" data-view="closed" aria-selected="false">Recently Closed</button>
    <button class="tab" role="tab" data-view="devices" aria-selected="false">Tabs From Other Devices</button>
  </div>

  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
